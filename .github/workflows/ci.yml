name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  check-profile:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify profile README exists
        run: test -s profile/README.md

  auto-assign:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue to maintainer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --add-assignee "${{ github.actor }}"
